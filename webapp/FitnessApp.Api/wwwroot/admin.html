<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Адмін-панель — FitnessTracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
  <span class="navbar-brand fw-bold">⚙️ FitnessTracker — Адмін-панель</span>
  <a href="/index.html" class="btn btn-outline-light btn-sm">← До кабінету користувача</a>
</nav>

<div id="adminContainer" class="container my-4">
  <div id="adminStatusBanner"></div>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card p-3 h-100">
        <h6>Додати вправу</h6>
        <input id="exName" class="form-control form-control-sm mb-2" placeholder="Назва вправи">
        <select id="exCat" class="form-select form-select-sm mb-2">
          <option value="0">Кардіо (Cardio)</option>
          <option value="1">Силова (Strength)</option>
          <option value="2">Йога (Yoga)</option>
        </select>
        <input id="exMet" type="number" min="1" max="30" step="0.1" class="form-control form-control-sm mb-2" value="6.5" placeholder="MET">
        <input id="exDesc" class="form-control form-control-sm mb-2" placeholder="Опис">
        <button class="btn btn-primary btn-sm mb-3" onclick="AdminApp.addExercise()">Зберегти вправу</button>
        <ul id="exList" class="list-group list-group-flush small"></ul>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-3 h-100">
        <h6>Додати шаблон тренування</h6>
        <input id="wtTitle" class="form-control form-control-sm mb-2" placeholder="Назва тренування">
        <select id="wtType" class="form-select form-select-sm mb-2">
          <option value="0">Кардіо</option>
          <option value="1">Силове</option>
          <option value="2">Йога</option>
        </select>
        <select id="wtDiff" class="form-select form-select-sm mb-2">
          <option value="0">Початковий</option>
          <option value="1">Середній</option>
          <option value="2">Просунутий</option>
        </select>
        <button class="btn btn-success btn-sm mb-3" onclick="AdminApp.addWorkout()">Зберегти тренування</button>
        <ul id="wtList" class="list-group list-group-flush small"></ul>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-3 h-100">
        <h6>Створити челендж</h6>
        <input id="chTitle" class="form-control form-control-sm mb-2" placeholder="Назва челенджу">
        <input id="chCal" type="number" min="100" class="form-control form-control-sm mb-2" value="2500" placeholder="Ціль (ккал)">
        <input id="chDays" type="number" min="1" max="365" class="form-control form-control-sm mb-2" value="14" placeholder="Тривалість (днів)">
        <button class="btn btn-warning btn-sm" onclick="AdminApp.addChallenge()">Опублікувати челендж</button>
      </div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <div class="card p-3 h-100">
        <h6>Звіт: Середня активність користувачів за період</h6>
        <div class="row g-2 mb-2">
          <div class="col-5"><input id="repFrom" type="date" class="form-control form-control-sm" value="2026-01-01"></div>
          <div class="col-5"><input id="repTo" type="date" class="form-control form-control-sm" value="2026-12-31"></div>
          <div class="col-2"><button class="btn btn-dark btn-sm w-100" onclick="AdminApp.loadAvgReport()">OK</button></div>
        </div>
        <div id="avgResult" class="alert alert-secondary py-2 small mb-0">Оберіть період та натисніть OK</div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card p-3 h-100">
        <h6>Зареєстровані користувачі</h6>
        <table class="table table-sm small mb-0">
          <table class="table table-sm small align-middle mb-0">
          <thead>
            <tr>
              <th>Email</th>
              <th>Роль</th>
              <th>Вага</th>
              <th class="text-end">Дії</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js?v=8"></script>
<script src="/js/admin.js?v=8"></script>
</body>
</html>
